<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04121c;--bg2:#082233;--pan:#0d2b3e;--pan2:#123448;--pan3:#1a4560;--line:#1d4a63;--line2:#2b6485;--txt:#eaf6ff;--dim:#8fb8cf;--mute:#5a8ba3;--acc:#1e6fff;--acc2:#00d4ff;--glow:rgba(30,111,255,.4);--gold:#ffd700;--coral:#f97362;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--rad:14px;--rad-sm:10px;--rad-lg:20px;--sh:0 24px 70px rgba(0,0,0,.6);--sh-lg:0 40px 100px rgba(0,0,0,.75);--glass:color-mix(in srgb,var(--pan) 82%,transparent);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"SF Mono",Consolas,monospace;--ease:cubic-bezier(.2,.9,.3,1.1)}
[data-theme="light"]{--bg:#eaf4fa;--bg2:#f2f9fd;--pan:#fff;--pan2:#f4fafe;--pan3:#e3f1f9;--line:#cde3ef;--line2:#a9cce0;--txt:#0a2c3d;--dim:#4a7a94;--mute:#7ba5bb;--sh:0 24px 70px rgba(10,50,80,.15);--sh-lg:0 40px 100px rgba(10,50,80,.22);--glass:color-mix(in srgb,var(--pan) 90%,transparent)}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:14px;transition:background .3s}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes winIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.7}}
.boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg));transition:opacity .6s}
.boot-mark{width:140px;height:140px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.boot-title{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.boot-ed{font-size:11px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-top:-18px}
.boot-text{color:var(--dim);font-size:13px;min-height:18px}
.progress{width:300px;height:4px;background:var(--pan2);border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--gold));transition:width .35s}
.boot-hint{position:absolute;bottom:24px;color:var(--mute);font-size:11px;display:flex;gap:14px}
.boot-hint b{color:var(--gold)}
.setup,.lock,.legal-gate{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,var(--glow),transparent 50%),var(--bg);padding:20px;overflow:auto}
.card{width:min(600px,100%);background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-lg);padding:30px;box-shadow:var(--sh-lg);animation:slideUp .5s var(--ease);max-height:92vh;overflow:auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.brand .mark{width:56px;height:56px;display:grid;place-items:center;flex-shrink:0}
.brand .mark svg{width:100%;height:100%}
.brand b{font-size:19px;display:block;background:linear-gradient(135deg,var(--acc2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--dim);font-size:11px}
h2{font-size:24px;margin-bottom:10px;font-weight:800;letter-spacing:-.5px}
h3{font-size:16px;margin-bottom:8px;font-weight:700}
p{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:600}
input[type=text],input[type=password],input[type=email]{width:100%;padding:11px 13px;background:var(--pan2);border:1px solid var(--line);border-radius:var(--rad-sm);color:var(--txt);font-size:14px;outline:none;transition:.2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:12px 22px;border-radius:var(--rad-sm);font-weight:700;font-size:14px;transition:.2s;box-shadow:0 6px 20px var(--glow);cursor:pointer;border:none}
.primary:hover{transform:translateY(-2px)}
.primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.actions button:not(.primary){padding:11px 18px;border-radius:var(--rad-sm);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;background:none}
.actions button:not(.primary):hover{background:var(--pan2)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.theme-card{padding:14px 6px;border:1px solid var(--line);border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;background:var(--pan2);font-weight:600;cursor:pointer;transition:.2s}
.theme-card.selected{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.theme{width:36px;height:36px;border-radius:10px;border:2px solid var(--line)}
.theme.dark{background:linear-gradient(135deg,#04121c,#0d2b3e)}
.theme.light{background:linear-gradient(135deg,#eaf4fa,#fff)}
.theme.auto{background:linear-gradient(135deg,#04121c 50%,#eaf4fa 50%)}
.opt-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.opt-row button{padding:8px 14px;border-radius:var(--rad-sm);background:var(--pan2);border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer}
.opt-row button.active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--pan2));color:var(--acc2)}
.lock-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock-mark{width:100px;height:100px;display:grid;place-items:center;animation:float 4s infinite}
.lock-mark svg{width:100%;height:100%}
.lock-clock{font-size:56px;font-weight:200;background:linear-gradient(135deg,var(--acc2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.lock-date{color:var(--dim);font-size:13px;margin-top:-10px}
.lock-user{color:var(--dim);font-size:14px;margin-top:6px;font-weight:600}
.lock input{width:240px;padding:14px;text-align:center;background:var(--pan2);border:1px solid var(--line);border-radius:var(--rad-sm);color:var(--txt);font-size:20px;letter-spacing:8px;outline:none}
.error{color:var(--err);font-size:12px;min-height:16px}
.legal-doc{color:var(--dim);font-size:12px;line-height:1.7}
.legal-doc h3{color:var(--txt);font-size:14px;margin:14px 0 6px;font-weight:700}
.legal-doc p{margin-bottom:8px;font-size:12px}
.legal-accept{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--pan2);border:1px solid var(--line);border-radius:var(--rad-sm);margin:14px 0;font-size:12px;line-height:1.5;cursor:pointer}
.legal-accept input{margin-top:2px;width:16px;height:16px;accent-color:var(--acc);flex-shrink:0}
.legal-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.legal-buttons button{padding:8px 14px;border-radius:var(--rad-sm);background:var(--pan2);border:1px solid var(--line);font-size:11px;font-weight:600;cursor:pointer}
.legal-viewer{position:fixed;inset:0;z-index:9600;display:grid;place-items:center;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);padding:20px}
.legal-viewer .card{width:min(700px,100%);max-height:90vh;display:flex;flex-direction:column}
.desktop{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--glass);backdrop-filter:blur(28px);border-bottom:1px solid var(--line);z-index:100;flex-shrink:0}
.top-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.top-brand .mark{width:28px;height:28px;display:grid;place-items:center}
.top-brand .mark svg{width:100%;height:100%}
.top-brand b{background:linear-gradient(135deg,var(--acc2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-brand small{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:1.5px}
.top-status{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim);margin-left:auto}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--pan2);border-radius:16px;border:1px solid var(--line);font-weight:600;font-size:10px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--pan3)}
.pill.online{background:color-mix(in srgb,var(--ok) 20%,var(--pan2));border-color:var(--ok);color:var(--ok)}
.pill.notif{position:relative}
.pill.notif.has::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--err);border:2px solid var(--pan)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
.dot.offline{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.saving{background:var(--warn);animation:pulse 1s infinite}
#clock{font-size:12px;font-variant-numeric:tabular-nums;font-weight:700}
.desktop-area{flex:1;position:relative;overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,96px);gap:8px;align-content:start;background:radial-gradient(circle at 12% 10%,rgba(30,111,255,.22),transparent 45%),radial-gradient(circle at 88% 85%,rgba(255,215,0,.08),transparent 45%)}
.wp-grid .desktop-area{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
.wp-neon .desktop-area{background:radial-gradient(circle at 20% 30%,rgba(30,111,255,.35),transparent 40%),radial-gradient(circle at 80% 70%,rgba(249,115,98,.25),transparent 40%),var(--bg)}
.wp-plain .desktop-area{background:var(--bg)}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--rad);transition:.15s;cursor:pointer;position:relative}
.desktop-icon:hover{background:rgba(255,255,255,.07);transform:translateY(-2px)}
[data-theme="light"] .desktop-icon:hover{background:rgba(0,0,0,.05)}
.desktop-icon span{font-size:32px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.desktop-icon b{font-size:10px;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.5)}
[data-theme="light"] .desktop-icon b{text-shadow:none}
.desktop-icon.pinned::before{content:"📌";position:absolute;top:2px;right:4px;font-size:10px;opacity:.7}
.widgets{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;max-width:280px;pointer-events:none}
.widget{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:var(--sh);pointer-events:auto;min-width:220px}
.widget-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.widget-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--dim)}
.widget-close{width:20px;height:20px;border-radius:6px;font-size:11px;color:var(--dim);cursor:pointer;background:none;border:none}
.widget-close:hover{background:var(--err);color:#fff}
.widget-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.widget-sub{font-size:11px;color:var(--mute);margin-top:2px}
.start-menu{position:absolute;left:14px;bottom:66px;width:380px;max-height:72vh;background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-lg);box-shadow:var(--sh-lg);z-index:300;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s var(--ease)}
.start-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.start-head strong{display:block;font-size:14px}
.start-head small{color:var(--dim);font-size:10px}
#powerBtn{width:32px;height:32px;border-radius:var(--rad-sm);background:var(--pan2);font-size:14px;cursor:pointer;border:none}
#powerBtn:hover{background:var(--err);color:#fff}
.search{width:calc(100% - 32px);margin:10px 16px;padding:10px 14px;background:var(--pan2);border:1px solid var(--line);border-radius:var(--rad-sm);color:var(--txt);font-size:12px;outline:none}
.app-grid{flex:1;overflow:auto;padding:0 16px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:var(--rad);transition:.15s;cursor:pointer}
.app-tile:hover{background:var(--pan2);transform:translateY(-2px)}
.app-tile span{font-size:24px}
.app-tile small{font-size:9px;color:var(--dim);text-align:center;font-weight:600}
.start-bottom{display:flex;gap:4px;padding:10px 16px;border-top:1px solid var(--line)}
.start-bottom button{flex:1;padding:8px 4px;border-radius:var(--rad-sm);background:var(--pan2);font-size:10px;font-weight:600;cursor:pointer;border:none}
.quick-panel{position:absolute;right:14px;bottom:66px;width:300px;padding:16px;background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-lg);box-shadow:var(--sh-lg);z-index:300;animation:slideUp .3s var(--ease)}
.quick-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;font-weight:700}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.quick{padding:14px 8px;border-radius:var(--rad);background:var(--pan2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600;cursor:pointer;border:none}
.quick:hover{background:var(--pan3)}
.quick.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.notif-panel{position:absolute;right:14px;top:54px;width:340px;max-height:480px;background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-lg);box-shadow:var(--sh-lg);z-index:350;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s var(--ease)}
.notif-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.notif-head b{font-size:13px}
.notif-head button{font-size:10px;padding:4px 8px;border-radius:5px;background:var(--pan2);border:none;cursor:pointer;color:var(--dim)}
.notif-list{flex:1;overflow:auto;padding:10px}
.notif-item{padding:10px 12px;border-radius:var(--rad-sm);background:var(--pan2);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.notif-item.unread{border-left:3px solid var(--acc)}
.notif-item b{font-size:12px;display:block;margin-bottom:2px}
.notif-item small{font-size:10px;color:var(--mute)}
.notif-empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:12px}
.window-layer{position:absolute;inset:0;pointer-events:none;z-index:200}
.window{position:absolute;min-width:320px;min-height:240px;background:var(--pan);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;animation:winIn .2s var(--ease)}
.window.focused{border-color:var(--acc);box-shadow:var(--sh-lg),0 0 0 1px var(--glow)}
.window-bar{height:40px;display:flex;align-items:center;padding:0 6px 0 14px;background:var(--pan2);border-bottom:1px solid var(--line);cursor:grab;flex-shrink:0}
.window-title{font-size:12px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.window-controls{display:flex;gap:2px}
.window-controls button{width:30px;height:26px;border-radius:6px;font-size:12px;color:var(--dim);display:grid;place-items:center;transition:.15s;cursor:pointer;border:none}
.window-controls button:hover{background:var(--line);color:var(--txt)}
.window-controls button[data-act=close]:hover{background:var(--err);color:#fff}
.window-body{flex:1;overflow:auto;padding:18px;font-size:13px;line-height:1.6}
.window.maximized{inset:0!important;border-radius:0;width:auto!important;height:auto!important;animation:none}
.window-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:10}
.app-h1{font-size:22px;margin-bottom:6px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.app-h2{font-size:10px;margin:16px 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;background:var(--pan2);border:1px solid var(--line);border-radius:var(--rad-sm);color:var(--txt);font-size:13px;outline:none}
.field textarea{min-height:100px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:9px 16px;border-radius:var(--rad-sm);font-size:12px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 12px var(--glow);cursor:pointer;border:none}
.btn:hover{transform:translateY(-1px)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn-ghost{background:var(--pan2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn-danger{background:var(--err)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;background:var(--pan2);border:1px solid var(--line);font-size:10px;color:var(--dim);font-weight:600}
.chip.ok{color:var(--ok)}
.chip.warn{color:var(--warn)}
.chip.err{color:var(--err)}
.chip.gold{color:var(--gold)}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:36px 0}
.empty-ic{font-size:44px;opacity:.3;display:block;margin-bottom:10px}
.file-list{display:flex;flex-direction:column;gap:2px}
.file-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rad-sm);font-size:12px;transition:.12s;border:1px solid transparent;cursor:pointer}
.file-item:hover{background:var(--pan2);border-color:var(--line)}
.file-item .ic{font-size:20px;width:26px;text-align:center}
.file-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.file-item .meta{color:var(--mute);font-size:10px}
.file-item .actions{display:flex;gap:2px;opacity:0;transition:.15s}
.file-item:hover .actions{opacity:1}
.notes-layout{display:flex;gap:14px;height:100%;min-height:380px}
.notes-sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--line);padding-right:10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.note-item{padding:9px 11px;border-radius:var(--rad-sm);cursor:pointer;border:1px solid transparent}
